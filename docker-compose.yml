services:
  cortes-argentinos:
    build:
      context: .
      dockerfile: Dockerfile
    image: cortes-argentinos:latest
    container_name: cortes-argentinos
    restart: unless-stopped
    ports:
      - "127.0.0.1:3020:3020"
    volumes:
      - cortes_data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3020/api/cortes').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  cortes_data:
